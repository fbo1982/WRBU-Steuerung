name: App checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q wrbu_steuerung/wrbu
      - run: node --check wrbu_steuerung/wrbu/static/app.js
      - run: node --test tests/frontend_probe.cjs
  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./wrbu_steuerung
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: wrbu-smoke:0.1.5
      - name: Start app and check health
        run: |
          docker run --detach --name wrbu-smoke --platform linux/${{ matrix.arch }} -p 127.0.0.1:18099:8099 wrbu-smoke:0.1.5
          python tests/container_smoke.py
      - name: Container log and cleanup
        if: always()
        run: |
          docker logs wrbu-smoke
          docker rm --force wrbu-smoke

